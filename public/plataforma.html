<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="robots" content="noindex">
  <title>Plataforma</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html, body { overflow-x: hidden; }
    .plat { max-width: 960px; margin: 0 auto; padding: 1rem 16px 48px; display: grid; gap: 1.2rem; }
    .plat h2, .plat h3 { margin: 0; }
    .rest-list { display: grid; gap: .8rem; }
    @media (min-width: 720px) { .rest-list { grid-template-columns: 1fr 1fr; } }
    .rest { display: grid; gap: .7rem; border-left: 5px solid var(--c, var(--primary)); }
    .rest-head { display: flex; gap: .8rem; align-items: center; min-width: 0; }
    .rest-logo { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; flex: 0 0 auto; background: var(--c, var(--primary)); display: grid; place-items: center; color: #fff; font-weight: 800; }
    .rest-head .t { min-width: 0; }
    .rest-head b, .rest-head .muted { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rest-head .muted { font-size: .85rem; }
    .links { display: flex; flex-wrap: wrap; gap: .4rem; }
    .two { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
    .colors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
    @media (min-width: 560px) { .colors { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .color-field { display: flex; gap: .5rem; align-items: center; padding: .45rem; border: 1px solid var(--border); border-radius: 12px; font-size: .85rem; cursor: pointer; }
    .color-field input { width: 40px; height: 40px; border: 0; padding: 0; background: none; cursor: pointer; flex: 0 0 auto; }
    .slug-preview { font-size: .82rem; word-break: break-all; }
    .done { border-color: var(--ok); }
    .stat { font-size: .85rem; }
  </style>
</head>
<body>
  <header class="topbar"><span class="brand">Plataforma · Cardápio digital</span><span class="spacer"></span>
    <button class="btn ghost small hidden" id="exit">Sair</button></header>

  <div class="login-wrap" id="login">
    <form class="login-box card grid" id="key-form">
      <h2>Área da agência</h2>
      <p class="muted">Digite a chave da plataforma (variável <code>PLATFORM_KEY</code> do servidor).</p>
      <input class="input" type="password" name="key" autocomplete="current-password" required autofocus style="letter-spacing:normal;font-size:1.1rem">
      <button class="btn block">Entrar</button>
    </form>
  </div>

  <main class="plat hidden" id="app">
    <section class="grid" style="gap:.8rem">
      <div class="row wrap"><h2 class="spacer">Restaurantes</h2><button class="btn" id="go-new">+ Novo restaurante</button></div>
      <div class="rest-list" id="list"><p class="muted">Carregando…</p></div>
    </section>

    <section class="card grid" id="new">
      <h3>Novo restaurante</h3>
      <form class="grid" id="create" autocomplete="off">
        <div class="two">
          <label class="field"><span>Nome do restaurante</span><input class="input" name="name" required maxlength="80" placeholder="Ex.: Bar do Zé"></label>
          <label class="field"><span>Endereço no sistema (slug)</span><input class="input" name="slug" required pattern="[a-z0-9][a-z0-9\-]{1,40}" maxlength="41" placeholder="bar-do-ze">
            <span class="muted slug-preview" id="slug-preview"></span></label>
        </div>
        <label class="field"><span>Frase de apresentação (opcional)</span><input class="input" name="tagline" maxlength="140"></label>
        <div class="two">
          <label class="field"><span>PIN da equipe (4 a 8 números)</span><input class="input" name="staff_pin" required inputmode="numeric" pattern="\d{4,8}" maxlength="8"></label>
          <label class="field"><span>Quantidade de mesas</span><input class="input" name="tables" type="number" min="0" max="200" value="10" required></label>
        </div>
        <label class="field"><span>WhatsApp (opcional, com DDD)</span><input class="input" name="whatsapp" inputmode="tel" placeholder="11999998888"></label>
        <div class="grid" style="gap:.4rem"><span class="muted" style="font-size:.9rem">Cores</span>
          <div class="colors">
            <label class="color-field"><input type="color" name="primary_color" value="#d32f2f"><span>Principal</span></label>
            <label class="color-field"><input type="color" name="accent_color" value="#ff9800"><span>Destaque</span></label>
            <label class="color-field"><input type="color" name="bg_color" value="#121212"><span>Fundo</span></label>
            <label class="color-field"><input type="color" name="text_color" value="#ffffff"><span>Texto</span></label>
          </div>
        </div>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="create-btn">Criar restaurante</button></div>
      </form>
      <div id="created"></div>
    </section>
  </main>
  <script type="module" src="/assets/js/plataforma.js"></script>
</body>
</html>
