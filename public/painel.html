<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <meta name="robots" content="noindex">
  <title>Painel do restaurante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    :root { --font: "Figtree", system-ui, sans-serif; }
    html, body { overflow-x: hidden; }
    .pn { max-width: 1040px; margin: 0 auto; padding: 24px 16px 56px; display: grid; gap: 28px; }
    .pn-logo { width: 52px; height: 52px; border-radius: 14px; flex: 0 0 auto; display: grid; place-items: center;
      background: var(--surface-2); color: var(--primary); font: 600 1.4rem "Fraunces", serif; overflow: hidden; }
    .pn-logo img { width: 100%; height: 100%; object-fit: cover; }
    .day { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .day h2 { font: 600 1.25rem "Fraunces", serif; margin: 0; }
    .day input { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; color-scheme: dark; }
    .stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 760px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; min-width: 0; }
    .stat small { display: block; color: var(--muted); font-size: .8rem; }
    .stat strong { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat.main { grid-column: 1 / -1; }
    .stat.main strong { font-size: 2rem; color: var(--primary); }
    @media (min-width: 760px) { .stat.main { grid-column: span 1; } }

    .cols { display: grid; gap: 10px; margin-top: 10px; }
    @media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-width: 0; }
    .box h3 { font-size: .95rem; margin: 0 0 12px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; }
    .row + .row { border-top: 1px solid var(--border); }
    .row .n { color: var(--muted); font-size: .85rem; }
    .bar { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--primary); border-radius: 6px; }
    .empty { color: var(--muted); font-size: .9rem; margin: 0; }
    .tip { color: var(--muted); font-size: .88rem; margin: 0; }
    .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
    .seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: .88rem; color: var(--muted); cursor: pointer; min-height: 36px; }
    .seg button[aria-pressed="true"] { background: var(--primary); color: #15110c; }
    .delta { display: inline-block; margin-top: 4px; font-size: .78rem; font-weight: 600; color: var(--muted); }
    .delta.up { color: #5fbf73; } .delta.down { color: #e5735f; }
    .chart { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; align-items: end; height: 150px; padding-top: 8px; }
    .chart .c { position: relative; height: 100%; display: flex; align-items: flex-end; }
    .chart .c i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--primary); min-height: 2px; opacity: .9; }
    .chart .c i.zero { background: var(--surface-2); }
    .chart .c:hover i { opacity: 1; filter: brightness(1.15); }
    .axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; margin-top: 6px; font-size: .68rem; color: var(--muted); text-align: center; }
    .axis span { overflow: hidden; white-space: nowrap; }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .chart-head b { font-size: 1.1rem; }
    .flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .flow div { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; min-width: 0; }
    .flow b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    .flow small { color: var(--muted); font-size: .72rem; }
    .flow .ok b { color: #5fbf73; } .flow .no b { color: #e5735f; }

    /* estrutura: menu lateral no computador; no celular, barra fina em cima e abas embaixo.
       Cada tela abre uma vez (iframe) e fica carregada. */
    :root { --side: 240px; --top-h: 0px; --tab-h: 0px; }
    .ic { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .side { display: none; }
    .side-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
    .side-brand .pn-logo { width: 40px; height: 40px; border-radius: 12px; font-size: 1.1rem; }
    .side-brand b { display: block; font-size: 1rem; line-height: 1.2; }
    .side-brand small { color: var(--muted); font-size: .78rem; }
    .side-label { display: block; margin: 16px 12px 6px; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .nav-item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 12px;
      color: var(--muted); font-weight: 700; font-size: .95rem; text-decoration: none; background: none; border: 0; text-align: left; cursor: pointer; }
    .nav-item:hover { background: var(--surface); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary); }
    .nav-item .wa-n { margin-left: auto; }
    .side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

    .top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      background: var(--bg); border-bottom: 1px solid var(--border); }
    .top .pn-logo { width: 34px; height: 34px; border-radius: 10px; font-size: 1rem; }
    .top b { font-size: 1rem; }
    .top small { color: var(--muted); font-size: .8rem; margin-left: auto; }
    .tabbar { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border); }
    .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border: 0; background: none;
      border-radius: 12px; color: var(--muted); font-size: .72rem; font-weight: 700; text-decoration: none; cursor: pointer; }
    .tab.active { color: var(--primary); }
    .tab .wa-n { position: absolute; top: 2px; left: 55%; }
    .more { position: fixed; z-index: 60; left: 8px; right: 8px; bottom: calc(var(--tab-h) + 8px); padding: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; display: grid; gap: 2px; }
    .pn { padding-bottom: calc(var(--tab-h) + 32px); }

    .pn-frame { position: fixed; left: 0; right: 0; top: var(--top-h); width: 100%; height: calc(100dvh - var(--top-h) - var(--tab-h)); border: 0; background: var(--bg); }
    .pn-frame.menu { max-width: 430px; margin: 0 auto; }
    .robo { max-width: 720px; margin: 0 auto; padding: 24px 16px calc(var(--tab-h) + 32px); display: grid; gap: 14px; }
    .robo h1 { font: 600 1.5rem "Fraunces", serif; margin: 0; }
    @media (min-width: 1024px) {
      body { padding-left: var(--side); }
      .side { display: flex; flex-direction: column; position: fixed; z-index: 50; inset: 0 auto 0 0; width: var(--side); padding: 20px 12px; overflow: auto;
        background: var(--bg); border-right: 1px solid var(--border); }
      .top, .tabbar, .more { display: none !important; }
      .pn-frame { left: var(--side); width: calc(100% - var(--side)); top: 0; height: 100dvh; }
      .pn-frame.menu { left: calc(var(--side) + (100% - var(--side) - 430px) / 2); top: 16px; height: calc(100dvh - 32px); margin: 0; border: 1px solid var(--border); border-radius: 22px; }
    }
    body.framed { overflow: hidden; }
    .wa-n { min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .72rem; font-weight: 750; text-align: center; }
    .wa-n[hidden], .wa-alert[hidden] { display: none; }
    .wa-alert { position: fixed; z-index: 300; left: 50%; bottom: calc(var(--tab-h) + 14px); transform: translateX(-50%); max-width: calc(100% - 32px);
      background: var(--danger); color: #fff; font-weight: 700; text-decoration: none; padding: 12px 18px; border-radius: 14px; box-shadow: 0 14px 34px -10px rgba(0,0,0,.6); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <aside class="side" id="side" aria-label="Menu do restaurante"></aside>
  <header class="top" id="top"></header>
  <main class="pn" id="app"><p class="muted">Carregando…</p></main>
  <section class="robo" id="robo" hidden></section>
  <nav class="tabbar" id="tabbar" aria-label="Menu do restaurante"></nav>
  <div class="more" id="more" hidden></div>
  <script type="module">
    import { api, esc, money, applyTheme, slugFromPath, STAFF_TABS, NAV_ICON } from '/assets/js/common.js';

    const PERIOD = {
      hoje: { label: 'Hoje', vs: 'vs ontem', chart: 'Vendas por hora', every: 3 },
      '7d': { label: '7 dias', vs: 'vs 7 dias antes', chart: 'Vendas por dia', every: 1 },
      '30d': { label: '30 dias', vs: 'vs 30 dias antes', chart: 'Vendas por dia', every: 5 },
    };
    const PAY = { dinheiro: 'Dinheiro', pix: 'Pix', cartao: 'Cartão', outro: 'Outro' };
    const ic = d => `<svg class="ic" viewBox="0 0 24 24">${d}</svg>`;
    const icon = p => (NAV_ICON[p] || '').replace('<svg ', '<svg class="ic" ') || ICON[p];
    const ICON = {
      menu: ic('<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 18.5h4"/>'),
      robo: ic('<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 16.5h6"/>'),
      mais: ic('<path d="M5 12h.01M12 12h.01M19 12h.01"/>'),
    };

    const slug = slugFromPath();
    const [{ restaurant: r }, list] = await Promise.all([api(`/api/r/${slug}/public`), api('/api/restaurants')]);
    applyTheme(r);
    document.title = `${r.name} · Painel`;
    const token = list.find(x => x.slug === slug)?.first_token;

    const logo = `<div class="pn-logo">${r.logo_url ? `<img src="${esc(r.logo_url)}" alt="">` : esc(r.name[0])}</div>`;
    document.getElementById('app').innerHTML = `
      <section>
        <div class="day"><h2>Vendas</h2>
          <div class="seg" id="period">${Object.entries(PERIOD).map(([k, v], i) => `<button type="button" data-p="${k}" aria-pressed="${!i}">${v.label}</button>`).join('')}</div></div>
        <div id="report"><p class="empty">Carregando…</p></div>
      </section>
      <p class="tip">No menu, escolha a tela: Cozinha e Caixa para o dia a dia, Pratos e mesas para mudar o cardápio.</p>`;

    // ---------- menu ----------
    const app = document.getElementById('app'), robo = document.getElementById('robo');
    const label = Object.fromEntries(STAFF_TABS);
    // [tela, nome no menu]; "robo" é uma área do próprio painel (controles do robô do WhatsApp), não um iframe
    const DIA = [['painel', label.painel], ['cozinha', label.cozinha], ['caixa', label.caixa], ['atendimento', label.atendimento]];
    const CONFIG = [['admin', label.admin], ['qrcodes', label.qrcodes], ['robo', 'Robô do WhatsApp']];
    const CLIENTE = token ? [['menu', 'Ver como cliente']] : [];
    const TABS = [...DIA, ...CONFIG, ...CLIENTE];
    const SRC = { menu: `/m/${token}` };
    const item = (cls, [p, l]) => `<a class="${cls}" href="#${p}" data-tab="${p}">${icon(p)}<span>${esc(l)}</span></a>`;
    document.getElementById('side').innerHTML = `
      <div class="side-brand">${logo}<div><b>${esc(r.name)}</b><small>Painel do restaurante</small></div></div>
      <nav>
        <span class="side-label">Dia a dia</span>${DIA.map(t => item('nav-item', t)).join('')}
        <span class="side-label">Configurar</span>${CONFIG.map(t => item('nav-item', t)).join('')}
      </nav>
      ${CLIENTE.length ? `<div class="side-foot">${CLIENTE.map(t => item('nav-item', t)).join('')}</div>` : ''}`;
    document.getElementById('top').innerHTML = `${logo}<b>${esc(r.name)}</b><small>Painel</small>`;
    const tabbar = document.getElementById('tabbar'), more = document.getElementById('more');
    tabbar.innerHTML = `${DIA.map(t => item('tab', t)).join('')}<button class="tab" type="button" id="more-btn" aria-expanded="false">${ICON.mais}<span>Mais</span></button>`;
    more.innerHTML = [...CONFIG, ...CLIENTE].map(t => item('nav-item', t)).join('');
    const moreBtn = document.getElementById('more-btn');
    const setMore = open => { more.hidden = !open; moreBtn.setAttribute('aria-expanded', open); };
    moreBtn.addEventListener('click', () => setMore(more.hidden));
    more.addEventListener('click', () => setMore(false));
    const fit = () => {
      const s = document.documentElement.style;
      s.setProperty('--top-h', `${document.getElementById('top').offsetHeight}px`);
      s.setProperty('--tab-h', `${tabbar.offsetHeight}px`);
    };
    new ResizeObserver(fit).observe(document.body);
    robo.innerHTML = `<h1>Robô do WhatsApp</h1>
      <p class="muted">Aqui ficam os controles do robô que responde no WhatsApp: pausar e voltar a responder, o funil de atendimento e o texto que a IA usa.</p>
      <div class="box" id="robo-slot"><p class="empty">Os controles do robô estão sendo preparados. As conversas continuam na tela WhatsApp.</p></div>`;

    const frames = {};
    function showTab() {
      let tab = location.hash.slice(1);
      if (!TABS.some(([p]) => p === tab)) tab = 'painel';
      app.hidden = tab !== 'painel';
      robo.hidden = tab !== 'robo';
      const framed = tab !== 'painel' && tab !== 'robo';
      document.body.classList.toggle('framed', framed);
      if (framed) frameFor(tab);
      for (const [k, f] of Object.entries(frames)) f.hidden = k !== tab;
      document.querySelectorAll('[data-tab]').forEach(a => {
        const on = a.dataset.tab === tab;
        a.classList.toggle('active', on);
        on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
      });
      moreBtn.classList.toggle('active', [...CONFIG, ...CLIENTE].some(([p]) => p === tab));
      setMore(false);
      if (tab === 'painel') loadReport().catch(() => {});
      else if (framed) frames[tab].focus();
    }
    addEventListener('hashchange', showTab);
    function frameFor(tab) {
      if (frames[tab]) return frames[tab];
      const f = document.createElement('iframe');
      f.className = `pn-frame ${tab}`;
      f.title = TABS.find(([p]) => p === tab)[1];
      f.allow = 'screen-wake-lock; xr-spatial-tracking; clipboard-write; web-share; fullscreen';
      f.src = SRC[tab] || `/r/${slug}/${tab}`;
      f.hidden = true;
      document.body.append(f);
      return (frames[tab] = f);
    }
    // WhatsApp carregado desde o início (escondido): toca o aviso de atendimento humano em qualquer aba
    frameFor('atendimento');
    addEventListener('message', e => {
      if (e.origin !== location.origin || e.data?.type !== 'wa-humano') return;
      document.querySelectorAll('[data-tab=atendimento]').forEach(a => {
        let b = a.querySelector('.wa-n');
        if (!b) { b = document.createElement('span'); b.className = 'wa-n'; a.append(b); }
        b.textContent = e.data.n; b.hidden = !e.data.n;
      });
      let al = document.getElementById('wa-alert');
      if (!al) {
        al = document.createElement('a'); al.id = 'wa-alert'; al.href = '#atendimento'; al.className = 'wa-alert';
        document.body.append(al);
      }
      al.hidden = !e.data.n || location.hash === '#atendimento';
      al.textContent = `${e.data.n === 1 ? `${e.data.nomes[0]} pede atendimento` : `${e.data.n} clientes pedem atendimento`} no WhatsApp. Abrir`;
    });
    addEventListener('hashchange', () => { const al = document.getElementById('wa-alert'); if (al && location.hash === '#atendimento') al.hidden = true; });

    let period = 'hoje';
    const pct = (a, b) => {
      if (!b) return a ? '<span class="delta up">novo</span>' : '<span class="delta">—</span>';
      const v = Math.round((a - b) / b * 100);
      return `<span class="delta ${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '▲' : v < 0 ? '▼' : ''} ${Math.abs(v)}% ${PERIOD[period].vs}</span>`;
    };
    async function loadReport() {
      const rep = await api(`/api/r/${slug}/dashboard?period=${period}`);
      const k = rep.kpis, b = rep.previous;
      const maxPay = Math.max(1, ...rep.by_payment.map(p => p.total));
      const maxTop = Math.max(1, ...rep.top_items.map(i => i.qty));
      const maxS = Math.max(1, ...rep.series.map(x => x.cents));
      const st = rep.status;
      const stat = (cls, label, value, now, before) =>
        `<div class="stat ${cls}"><small>${label}</small><strong>${value}</strong>${before === undefined ? '' : pct(now, before)}</div>`;
      document.getElementById('report').innerHTML = `
        <div class="stats">
          ${stat('main', 'Faturamento recebido', money(k.received_cents), k.received_cents, b.received_cents)}
          ${stat('', 'Pedidos', k.orders, k.orders, b.orders)}
          ${stat('', 'Ticket médio por conta', money(k.avg_ticket_cents), k.avg_ticket_cents, b.avg_ticket_cents)}
          ${stat('', 'Contas fechadas', k.closed_tabs, k.closed_tabs, b.closed_tabs)}
          ${stat('', 'Pessoas atendidas', k.people, k.people, b.people)}
          ${stat('', 'Mesas abertas agora', rep.open_tabs)}
        </div>
        <div class="box" style="margin-top:10px">
          <div class="chart-head"><h3>${PERIOD[period].chart}</h3><b>${money(k.orders_cents)}</b></div>
          <div class="chart" role="img" aria-label="${PERIOD[period].chart}">${rep.series.map(x =>
            `<div class="c" title="${x.label}: ${money(x.cents)} · ${x.orders} pedido${x.orders === 1 ? '' : 's'}"><i class="${x.cents ? '' : 'zero'}" style="height:${Math.max(2, Math.round(x.cents / maxS * 100))}%"></i></div>`).join('')}</div>
          <div class="axis">${rep.series.map((x, i) => `<span>${i % PERIOD[period].every === 0 ? x.label : ''}</span>`).join('')}</div>
        </div>
        <div class="box" style="margin-top:10px"><h3>Pedidos na cozinha</h3>
          <div class="flow">
            <div><b>${st.received}</b><small>Novos</small></div>
            <div><b>${st.preparing}</b><small>Em preparo</small></div>
            <div><b>${st.ready}</b><small>Prontos</small></div>
            <div class="ok"><b>${st.delivered}</b><small>Entregues</small></div>
            <div class="no"><b>${st.canceled}</b><small>Cancelados</small></div>
          </div>
        </div>
        <div class="cols">
          <div class="box"><h3>Como pagaram</h3>${rep.by_payment.length ? rep.by_payment.map(p => `
            <div class="row"><span>${esc(PAY[p.payment_method] || p.payment_method)} <span class="n">· ${p.n} conta${p.n > 1 ? 's' : ''}</span></span>
              <b>${money(p.total)}</b><div class="bar"><i style="width:${Math.round(p.total / maxPay * 100)}%"></i></div></div>`).join('')
            : '<p class="empty">Nenhuma conta fechada no período.</p>'}</div>
          <div class="box"><h3>Mais vendidos</h3>${rep.top_items.length ? rep.top_items.slice(0, 6).map(i => `
            <div class="row"><span>${esc(i.name)} <span class="n">· ${i.qty}x</span></span><b>${money(i.total)}</b>
              <div class="bar"><i style="width:${Math.round(i.qty / maxTop * 100)}%"></i></div></div>`).join('')
            : '<p class="empty">Nenhum pedido no período.</p>'}</div>
        </div>`;
    }
    document.getElementById('period').addEventListener('click', e => {
      const btn = e.target.closest('button[data-p]');
      if (!btn) return;
      period = btn.dataset.p;
      document.querySelectorAll('#period button').forEach(x => x.setAttribute('aria-pressed', x === btn));
      loadReport();
    });
    showTab();
    setInterval(() => { if (!document.hidden && !app.hidden) loadReport().catch(() => {}); }, 15000);
  </script>
</body>
</html>
